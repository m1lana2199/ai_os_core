[package]
name = "ai_os_core"
version = "1.3.0"
edition = "2021"
description = "High-performance system monitoring and control kernel for low-latency environments."
license = "MIT"
authors = ["m1lana2199 <milanagrisenko3@gmail.com>"]
repository = "https://github.com/m1lana2199/ai_os_core"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
eframe = "0.26"
egui = "0.26"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }
jsonwebtoken = "9.2"
dotenvy = "0.15"
wasmtime = "19.0"
wasmtime-wasi = "19.0"
ed25519-dalek = "2.1"
once_cell = "1.19"
tokio-tungstenite = "0.21"
futures-util = "0.3"
num_cpus = "1.16"
sysinfo = "0.30"